name: Release

# On a version tag, build dist/, prove the CLI and doctor actually run, pack a
# tarball with dist/ prebuilt in it (so a consumer never has to compile
# TypeScript to install this), and attach it to a GitHub Release.
#
# Mirrors opp-axi/palette-axi/monday-axi/launchpad-axi's release.yml shape,
# adapted for npm: this is a Node/TypeScript package (see package.json), not a
# Python zipapp, so the artifact is `npm pack` output, not a .pyz.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish crswd-axi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm run build
      - run: npx vitest run
      - run: npm run skill:check
      - run: npx -y axi-axi validate "node bin/crswd-axi.js" --dir . --timeout 30000

      - name: Smoke-test the built CLI
        run: node bin/crswd-axi.js --help >/dev/null

      # doctor is the promise this repo makes to a new user: it must run on a
      # box where NOTHING is configured. Exit 1 is the correct answer there
      # (a required connector, the shared secret, is down) -- what must not
      # happen is a crash or a hang. See docs/axi-contract.md: a check that
      # cannot run must REFUSE, never pass.
      - name: Doctor runs on a runner with nothing configured
        run: |
          set +e
          timeout 30 node bin/crswd-axi.js doctor
          rc=$?
          set -e
          if [ "$rc" -ne 1 ] && [ "$rc" -ne 5 ]; then
            echo "doctor exited $rc, expected 1 (nothing configured) or 5 (optional gap only)"
            exit 1
          fi

      - name: Pack tarball
        run: npm pack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            crswd-axi-*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
